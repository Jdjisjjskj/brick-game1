<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>打磚塊加球版（右偏移）</title>
<style>
body { margin:0; background:#000; display:flex; justify-content:center; align-items:center; height:100vh; overflow:hidden; }
canvas { background:#111; display:block; touch-action: none; }
</style>
</head>
<body>
<canvas id="game" width="480" height="320"></canvas>
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

const offsetX = 20; // 整個遊戲往右偏移量

// ------------------- 遊戲變數 -------------------
const ballRadius = 8;
const paddleHeight = 8;
const paddleWidth = 75;
let paddleX;

let brickRowCount = 6;
let brickColumnCount = 8;
const brickWidth = 40;
const brickHeight = 15;
const brickPadding = 5;
const brickOffsetTop = 20;
const brickOffsetLeft = 20;

let bricks = [];
let balls = [];
let powerUps = [];
let score;

// ------------------- 初始化遊戲 -------------------
function initGame() {
    paddleX = (canvas.width - paddleWidth)/2;
    score = 0;
    balls = [{x: canvas.width/2, y: canvas.height-30, dx:2, dy:-2}];
    powerUps = [];

    bricks = [];
    for(let c=0;c<brickColumnCount;c++){
        bricks[c] = [];
        for(let r=0;r<brickRowCount;r++){
            let power = Math.random() < 0.2; // 20%加球磚塊
            bricks[c][r] = {x:0, y:0, status:1, powerUp: power};
        }
    }
}

// ------------------- 控制 -------------------
let rightPressed = false;
let leftPressed = false;

document.addEventListener('keydown', e=>{
    if(e.key==='ArrowRight') rightPressed = true;
    else if(e.key==='ArrowLeft') leftPressed = true;
});
document.addEventListener('keyup', e=>{
    if(e.key==='ArrowRight') rightPressed = false;
    else if(e.key==='ArrowLeft') leftPressed = false;
});

// 滑鼠 & 觸控
canvas.addEventListener('mousemove', e => {
    let rect = canvas.getBoundingClientRect();
    let mouseX = e.clientX - rect.left;
    paddleX = mouseX - paddleWidth/2;
    if(paddleX < 0) paddleX = 0;
    if(paddleX > canvas.width - paddleWidth) paddleX = canvas.width - paddleWidth;
});
canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    let rect = canvas.getBoundingClientRect();
    let touchX = e.touches[0].clientX - rect.left;
    paddleX = touchX - paddleWidth/2;
    if(paddleX < 0) paddleX = 0;
    if(paddleX > canvas.width - paddleWidth) paddleX = canvas.width - paddleWidth;
}, {passive:false});

// ------------------- 碰撞磚塊 -------------------
function collisionDetection(ball){
    for(let c=0;c<brickColumnCount;c++){
        for(let r=0;r<brickRowCount;r++){
            let b = bricks[c][r];
            if(b.status===1){
                if(ball.x + offsetX > b.x && ball.x + offsetX < b.x+brickWidth &&
                   ball.y > b.y && ball.y < b.y+brickHeight){
                    ball.dy = -ball.dy;
                    b.status = 0;
                    score++;
                    if(b.powerUp){
                        powerUps.push({x: b.x + brickWidth/2 -4, y: b.y, width:8, height:8});
                    }
                    if(score === brickRowCount*brickColumnCount){
                        initGame();
                    }
                }
            }
        }
    }
}

// ------------------- 更新加球道具 -------------------
function updatePowerUps(){
    for(let i=powerUps.length-1;i>=0;i--){
        let p = powerUps[i];
        p.y += 2;
        if(p.y + p.height > canvas.height - paddleHeight &&
           p.x + offsetX > paddleX && p.x + offsetX < paddleX + paddleWidth){
            balls.push({x: paddleX + paddleWidth/2, y: canvas.height-30, dx:2, dy:-2});
            powerUps.splice(i,1);
        }
        else if(p.y > canvas.height) powerUps.splice(i,1);
    }
}

// ------------------- 畫磚塊 -------------------
function drawBricks(){
    for(let c=0;c<brickColumnCount;c++){
        for(let r=0;r<brickRowCount;r++){
            if(bricks[c][r].status===1){
                let brickX = (c*(brickWidth+brickPadding)) + brickOffsetLeft + offsetX;
                let brickY = (r*(brickHeight+brickPadding)) + brickOffsetTop;
                bricks[c][r].x = brickX;
                bricks[c][r].y = brickY;
                ctx.beginPath();
                ctx.rect(brickX, brickY, brickWidth, brickHeight);
                ctx.fillStyle = bricks[c][r].powerUp ? "orange" : "blue";
                ctx.fill();
                ctx.closePath();
            }
        }
    }
}

// ------------------- 畫球 -------------------
function drawBalls(){
    for(let i=0;i<balls.length;i++){
        let ball = balls[i];
        ctx.beginPath();
        ctx.arc(ball.x + offsetX, ball.y, ballRadius, 0, Math.PI*2);
        ctx.fillStyle = "red";
        ctx.fill();
        ctx.closePath();
    }
}

// ------------------- 畫平台 -------------------
function drawPaddle(){
    ctx.beginPath();
    ctx.rect(paddleX + offsetX, canvas.height-paddleHeight, paddleWidth, paddleHeight);
    ctx.fillStyle = "lime";
    ctx.fill();
    ctx.closePath();
}

// ------------------- 畫加球道具 -------------------
function drawPowerUps(){
    for(let i=0;i<powerUps.length;i++){
        let p = powerUps[i];
        ctx.beginPath();
        ctx.rect(p.x + offsetX, p.y, p.width, p.height);
        ctx.fillStyle = "yellow";
        ctx.fill();
        ctx.closePath();
    }
}

// ------------------- 畫分數 -------------------
function drawScore(){
    ctx.fillStyle = "white";
    ctx.font = "14px Arial";
    ctx.fillText("Score: "+score, 8, 16);
}

// ------------------- 遊戲主迴圈 -------------------
function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    drawBricks();
    drawBalls();
    drawPaddle();
    drawPowerUps();
    drawScore();

    for(let i=balls.length-1;i>=0;i--){
        let ball = balls[i];
        collisionDetection(ball);
        if(ball.x + ball.dx + offsetX > canvas.width-ballRadius || ball.x + ball.dx + offsetX < ballRadius) ball.dx = -ball.dx;
        if(ball.y + ball.dy < ballRadius) ball.dy = -ball.dy;
        else if(ball.y + ball.dy > canvas.height-ballRadius){
            if(ball.x + offsetX > paddleX && ball.x + offsetX < paddleX + paddleWidth) ball.dy = -ball.dy;
            else balls.splice(i,1);
        }
        ball.x += ball.dx;
        ball.y += ball.dy;
    }

    updatePowerUps();

    if(rightPressed && paddleX < canvas.width-paddleWidth) paddleX += 5;
    if(leftPressed && paddleX > 0) paddleX -= 5;

    if(balls.length === 0) initGame();

    requestAnimationFrame(draw);
}

// ------------------- 開始遊戲 -------------------
initGame();
draw();
</script>
</body>
</html>
